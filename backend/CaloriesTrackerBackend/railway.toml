[build]
builder = "RAILPACK"
buildCommand = "npm install && npx prisma generate && npx tsc"

[deploy]
startCommand = "npx prisma migrate deploy && node prisma/scripts/seed_demo.js && node nodeApp/app.js"
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/calories/categories"
healthcheckTimeout = 300
